<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="container">
            <div class="text"> <h2>Todo List</h2> </div>
            <div class="form-container" >
                <form>
                    <input type="text" name="input-data" id="inputtask" class="todo-list" placeholder="Enter The Task">
                    <button id="btnAdd" type="button" >Add</button>
                </form>
                <ul class="todoList" id="tasklist"></ul>
            </div>
        </div>
    </main>

    
    <script src="script.js"></script>
</body>
</html>
